# Packages `ncu -u` must not raise, and why. Drop an entry once its blocker is
# gone so the next run picks the package up again.

# Yarn refuses to install versions younger than npmMinimalAgeGate (24h by default),
# so proposing them here would only produce an uninstallable package.json.
cooldown: 1d

reject:
  # typescript: held at 6.x. tests/unit/toolbar/ribbon-menu-primitives/fixtures.ts
  # imports the compiler API (`import ts from 'typescript'`) to parse the ribbon
  # menu sources; 7.x no longer exposes that API from the package entry point.
  - typescript
