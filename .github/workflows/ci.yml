name: CI

on:
  push:
    branches: [main, develop]
    tags-ignore:
      - 'v*.*.*'
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig.base.json'
      - 'biome.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/visual-baselines.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig.base.json'
      - 'biome.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/visual-baselines.yml'

jobs:
  build:
    name: build (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - run: corepack enable
      - run: corepack prepare yarn@4.18.1 --activate

      - uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build:all
      # Reads the declarations the build above emitted.
      - name: Check the public API surface
        run: node scripts/api-surface/check.mjs
      # Packs the libraries the build above emitted and checks what would be uploaded.
      - name: Check the packed packages
        run: yarn check:pack
      - run: yarn typecheck
      - name: Run unit tests with coverage
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          # Coverage instrumentation on a shared runner runs the full-mount
          # tests several times slower than a local run.
          FC_TEST_TIMEOUT_SCALE: '3'
        run: yarn workspace @libraz/formulon-cell test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@v7
        with:
          files: packages/formulon-cell/coverage/lcov.info
          flags: formulon-cell
          fail_ci_if_error: false

  e2e:
    name: e2e (${{ matrix.app }}, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [react-demo, vue-demo]
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - run: corepack enable
      - run: corepack prepare yarn@4.18.1 --activate

      - uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - run: yarn install --immutable

      - name: Install ${{ matrix.browser }}
        run: yarn playwright install --with-deps ${{ matrix.browser }}

      # CI runs every spec on every app; local runs narrow the secondary app (tests/e2e-shared/adapter-specs.ts).
      - name: Run e2e
        env:
          CI: 'true'
        run: yarn workspace @formulon-cell/${{ matrix.app }} test:e2e --project='${{ matrix.browser }}*'

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.app }}-${{ matrix.browser }}
          path: |
            apps/${{ matrix.app }}/test-results/**
            apps/${{ matrix.app }}/playwright-report/**
          retention-days: 7
